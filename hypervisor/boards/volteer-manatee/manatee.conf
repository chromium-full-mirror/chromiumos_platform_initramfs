BOARD_IRQS=$(
  echo "edge:1"
  echo "level:14"
  echo "edge:35"
  echo "level:51"
  echo "level:59"
  echo "level:100"
  echo "level:116")

BOARD_GPES=$(
  # Typec wakeup
  echo "109"
  # EC gpe
  echo "110")

BOARD_PMIO=$(
  # Super I/O
  echo -n "0x2e-0x2f,"
  echo -n "0x4e-0x4f,"

  # KBD
  echo -n "0x60,"
  echo -n "0x62-0x67,"
  # EC
  echo -n "0x70-0x77,"

  echo -n "0x81-0xef,"
  echo -n "0x200,"
  echo -n "0x204,"
  echo -n "0x800-0x9ff")

BOARD_MMIO=$(
  # PMC (INTC1026): 0xfe000000
  echo -n "0xfe000000-0xfe00ffff,"
  # IOM (INTC1072): 0xfbc10000
  echo -n "0xfbc10000-0xfbc115ff")
