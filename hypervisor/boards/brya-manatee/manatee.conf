  # KBD
  echo -n "0x60,"
  echo -n "0x62-0x67,"
  echo -n "0x70-0x77,"
  echo -n "0x81-0xef,"
  echo -n "0x200,"
  echo -n "0x204,"
  echo -n "0x800-0x9ff")

BOARD_MMIO=$(
  # INTC1055 (GPIO controller):
  echo -n "0xfd690000-0xfd69ffff,"
  echo -n "0xfd6a0000-0xfd6affff,"
  echo -n "0xfd6d0000-0xfd6dffff,"
  echo -n "0xfd6e0000-0xfd6effff,"
